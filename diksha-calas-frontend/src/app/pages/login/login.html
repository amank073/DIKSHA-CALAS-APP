<div class="login-page">

  <div class="login-card">

    <div class="brand">
      <div class="logo">D</div>
      <h1>DIKSHA CALAS</h1>
      <p>Learning & Academic Support System</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Enter your email" autocomplete="email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="Enter your password"
          autocomplete="current-password" />
      </div>

      @if (errorMessage) {
      <div style="color: #ef4444; font-size: 14px; text-align: center; margin-bottom: 16px;">
        {{ errorMessage }}
      </div>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <div class="switch-link">
      New student?
      <a routerLink="/register">Create an account</a>
    </div>

  </div>

</div>
